name: Native integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.cells.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cells
        run: echo "matrix=$(php mcp/tests/Integration/ci/matrix.php --matrix)" >> "$GITHUB_OUTPUT"
  integration:
    needs: matrix
    name: NC ${{ matrix.nc }} / ${{ matrix.db }} / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cells) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, zip, sqlite3
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: mcp/.node-version
      - name: Install locked npm version
        run: npm install --global npm@11.19.0
      - name: Run the pinned disposable cell
        env:
          CELL_NC: ${{ matrix.nc }}
          CELL_DB: ${{ matrix.db }}
          CELL_MODE: ${{ matrix.mode }}
        run: composer --working-dir=mcp test:integration -- "$CELL_NC" "$CELL_DB" "$CELL_MODE"
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-nc${{ matrix.nc }}-${{ matrix.db }}-${{ matrix.mode }}
          path: mcp/build/integration/*/mcp-it/artifacts/
          if-no-files-found: error
          retention-days: 14
