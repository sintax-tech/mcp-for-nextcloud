#
# Verification-only CI: installs the app into a disposable official Nextcloud container next to a disposable
# database, through the server's own installer (fresh) or upgrade (from the released baseline), and runs the
# integration suite in mcp/tests/Integration with two real database sessions and real core events. Deck, Mail, Tables,
# Forms, Polls and Collectives opt-ins run alongside Groupfolders, external storage, Talk and Notes exclusion fixtures.
# Images, actions and the PHPUnit PHAR are pinned by digest, commit or checksum. It never publishes, releases or uploads anything but test logs.

name: Integration

# Twelve verification jobs: NC32–35 on MariaDB, plus NC35 on PostgreSQL and SQLite, fresh and upgrade.
# Branches other than main run through a pull request or by hand.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Isolate pull requests by number, including requests from forks, and other runs by ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: NC ${{ matrix.cell.nc }} · ${{ matrix.cell.db }} · ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
        cell:
          - nc: '32'
            db: mariadb
            nc_image: nextcloud:32.0.15-apache@sha256:ea5ecac73dfe90f7bf80e4867edfcf3f0fcbf4e5d83ea75cf433f7ef545ed412
            db_image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
          - nc: '33'
            db: mariadb
            nc_image: nextcloud:33.0.9-apache@sha256:8f46dc79e9abf4f1e330ca9a7d9d9b8a8811ecc28f18018c1951281e522499e8
            db_image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
          - nc: '34'
            db: mariadb
            nc_image: nextcloud:34.0.4-apache@sha256:0e5688ba0988b9112cf03f9c6bab53eccb466d278435f6596f16c1f25acacf74
            db_image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
          - nc: '35'
            db: mariadb
            nc_image: nextcloud:35.0.1-apache@sha256:8f2f0e93aca5e9457019933936dea1f313052e72c696b4aecb31580a208b859f
            db_image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
          - nc: '35'
            db: pgsql
            nc_image: nextcloud:35.0.1-apache@sha256:8f2f0e93aca5e9457019933936dea1f313052e72c696b4aecb31580a208b859f
            db_image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          - nc: '35'
            db: sqlite
            nc_image: nextcloud:35.0.1-apache@sha256:8f2f0e93aca5e9457019933936dea1f313052e72c696b4aecb31580a208b859f
            db_image: ''
    env:
      MCP_IT_NC: ${{ matrix.cell.nc }}
      MCP_IT_NC_IMAGE: ${{ matrix.cell.nc_image }}
      MCP_IT_DB: ${{ matrix.cell.db }}
      MCP_IT_DB_IMAGE: ${{ matrix.cell.db_image }}
      MCP_IT_MODE: ${{ matrix.mode }}
      MCP_IT_BASELINE: v1.2.5
      # Official archives are SHA-256 checked by harness.sh and each app cell.
      # Collectives 4.7.1; Tables 1.0.10 (NC32), 2.2.2 (NC33/34), 2.3.2 (NC35).
      MCP_IT_WITH_DECK: '1'
      MCP_IT_WITH_MAIL: '1'
      MCP_IT_WITH_TABLES: '1'
      MCP_IT_WITH_FORMS: '1'
      MCP_IT_WITH_POLLS: '1'
      MCP_IT_WITH_COLLECTIVES: '1'
      HARNESS: mcp/tests/Integration/ci/harness.sh
    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP for packaging
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, zip, sqlite3
          coverage: none
      - name: Build the packages with the official script
        run: sh "$HARNESS" packages
      - name: Fetch the pinned PHPUnit PHAR
        run: sh "$HARNESS" tools
      - name: Start the database
        run: sh "$HARNESS" start-db
      # A crashed Apache worker leaves its core inside the Nextcloud container, where the collect step reads it with
      # gdb (mcp/tests/Integration/ci/crash-evidence.sh). The pattern is global to the runner's kernel.
      - name: Send core dumps to the Nextcloud container
        run: sudo sysctl -w kernel.core_pattern=/tmp/mcp-it-core.%e.%p
      - name: Start and install Nextcloud
        run: sh "$HARNESS" start-nextcloud
      - name: Install or upgrade the app through the server
        run: sh "$HARNESS" install-app
      - name: Create fixture users and groups
        run: sh "$HARNESS" fixtures
      - name: Provision native apps and all six optional app fixtures
        run: sh "$HARNESS" provision
      - name: Record the runtime
        run: sh "$HARNESS" report
      - name: Run the integration suite
        run: sh "$HARNESS" test
      - name: Collect logs
        if: always()
        run: sh "$HARNESS" collect
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-nc${{ matrix.cell.nc }}-${{ matrix.cell.db }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/mcp-it/artifacts
          if-no-files-found: ignore
          retention-days: 14
      - name: Clean up the disposable Mail server
        if: always()
        run: sh mcp/tests/Integration/ci/mail-cell.sh cleanup
