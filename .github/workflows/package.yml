#
# Verification-only CI: builds the store package (rejected by scripts/check_package.php
# on any problem) and checks the REUSE compliance of the repository.
# It never publishes, releases or uploads anything.

name: Package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Build and check the store package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, zip, sqlite3
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: mcp/.node-version
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: mcp
      - name: Build the package (fails when check_package.php refuses it)
        run: composer package
        working-directory: mcp
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the REUSE compliance
        uses: fsfe/reuse-action@v5
