#
# Verification-only CI: runs the PHPUnit suite on every PHP version the app supports.
# It never publishes, releases or uploads anything.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, gd, zip, sqlite3
          coverage: none
          tools: composer:v2
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('mcp/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php-version }}-
            composer-${{ runner.os }}-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
        working-directory: mcp
      - uses: actions/setup-node@v4
        with:
          node-version-file: mcp/.node-version
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: mcp
      - name: Run the test suite
        run: composer test
        working-directory: mcp

  javascript:
    name: JavaScript (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: mcp/.node-version
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: mcp
      - name: Install required browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
        working-directory: mcp
      - name: Run the complete JavaScript suite
        run: composer test:js
        working-directory: mcp
