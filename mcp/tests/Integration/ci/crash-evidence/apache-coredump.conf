#
# Mounted into conf-enabled/ of the disposable Nextcloud container by crash-evidence.sh. On Linux, CoreDumpDirectory
# makes the workers dumpable again after they switch to www-data, so a crashing worker leaves a core where the
# runner's kernel.core_pattern points (/tmp/mcp-it-core.<exe>.<pid>, set by .github/workflows/integration.yml).
CoreDumpDirectory /tmp
