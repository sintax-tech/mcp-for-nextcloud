#
# Override for the throwaway IMAP server of the Mail integration cells (mail-cell.sh), mounted read-only into
# /etc/dovecot/conf.d of the pinned dovecot/dovecot 2.4 image. The server only lives on the private network of one run.

# Plain-text login without TLS: the Nextcloud container reaches the server on the run's own network only.
auth_allow_cleartext = yes

# An archive folder with its RFC 6154 role, next to the English defaults of the image (Sent, Drafts, Trash, Junk).
namespace inbox {
  mailbox Archive {
    special_use = \Archive
  }
}
